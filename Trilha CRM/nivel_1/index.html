<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - CRM Contatos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Novo Contato (CRM)</h2>
        <div class="painel">
            <div class="form-group">
                <input type="text" id="nome-cliente" placeholder="Nome do Cliente">
                <input type="email" id="email-cliente" placeholder="E-mail">
                <button id="btn-salvar">Salvar Contato</button>
            </div>
            <div class="lista-container">
                <h3>Contatos Recentes</h3>
                <div id="lista-contatos">
                    <!-- Os cards gerados pelo JS aparecerão aqui -->
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
